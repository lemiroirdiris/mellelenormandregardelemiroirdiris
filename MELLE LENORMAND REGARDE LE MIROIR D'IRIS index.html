<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Miroir d'Iris</title>
<style>
:root{
  --bg:#0a090d; --bg2:#150f1e;
  --iris:#8a6bc9; --gold:#d9b46a; --gold-soft:#eeddb0;
  --ink:#f1ecf6; --ink-dim:#ab9fc0; --panel:#1b1524;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; min-height:100%;
  background:radial-gradient(ellipse 60% 40% at 50% 8%, rgba(138,107,201,.18), transparent 70%), var(--bg);
  color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
  display:flex; flex-direction:column; align-items:center;
  padding:2.2rem 1.25rem 3rem;
  overflow-x:hidden;
}
.eyebrow{ font-size:.78rem; letter-spacing:.03em; color:var(--ink-dim); margin:0 0 .3rem; }
h1{ font-weight:400; font-size:clamp(1.5rem,5vw,2.2rem); margin:0 0 .2rem; color:var(--gold-soft); }
.sub{ color:var(--ink-dim); font-size:.88rem; max-width:38ch; text-align:center; margin:0 0 1.2rem; }

.pillrow{ display:flex; gap:.4rem; flex-wrap:wrap; justify-content:center; margin-bottom:.7rem; }
.pill{
  appearance:none; border:1px solid rgba(217,180,106,.45); background:transparent;
  color:var(--ink-dim); padding:.35rem .85rem; border-radius:999px;
  font-family:inherit; font-size:.78rem; cursor:pointer; transition:.2s;
}
.pill.active{ background:var(--gold); border-color:var(--gold); color:#150f1e; }
.pill:hover:not(.active){ border-color:var(--gold); color:var(--gold-soft); }
.pillgap{ margin-bottom:1.6rem; }

.stage{ perspective:1300px; width:min(84vw,280px); aspect-ratio:2/3.15; margin-bottom:1.5rem; cursor:pointer; }
.card{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .9s cubic-bezier(.2,.7,.2,1); }
.stage.flipped .card{ transform:rotateY(180deg); }
.face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:16px; display:flex; align-items:center; justify-content:center; padding:1.1rem; text-align:center; }

.face-back{ background:linear-gradient(160deg,var(--panel),#0f0a16); border:1px solid rgba(217,180,106,.5); box-shadow:0 12px 34px rgba(0,0,0,.5); }
.medallion{ width:64%; aspect-ratio:1; border-radius:50%; overflow:hidden; border:1.5px solid var(--gold); box-shadow:0 0 0 5px rgba(217,180,106,.08), inset 0 0 20px rgba(0,0,0,.6); }
.medallion img{ width:100%; height:100%; object-fit:cover; object-position:22% 40%; display:block; }

.face-front{ background:linear-gradient(165deg,#1c1526,#100a17); border:1px solid rgba(217,180,106,.6); box-shadow:0 12px 34px rgba(0,0,0,.55); transform:rotateY(180deg); flex-direction:column; gap:.5rem; }
.card-name{ font-size:1.1rem; color:var(--gold-soft); margin:0; }
.card-key{ font-size:.76rem; color:var(--iris); margin:0; }
.card-rule{ width:30px; height:1px; background:var(--gold); opacity:.7; }
.card-msg{ font-size:.86rem; line-height:1.55; color:var(--ink); margin:0; white-space:pre-line; text-wrap:balance; hyphens:manual; overflow-wrap:break-word; }
.card-name,.card-key{ text-wrap:balance; }

.action{ appearance:none; border:1px solid var(--gold); background:transparent; color:var(--gold-soft); padding:.66rem 1.6rem; border-radius:999px; font-family:inherit; font-size:.92rem; cursor:pointer; transition:background .25s, color .25s; }
.action:hover{ background:var(--gold); color:#150f1e; }
.action:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:3px; }

.guidance{ max-width:38ch; text-align:center; color:var(--ink-dim); font-size:.82rem; margin-top:1.2rem; min-height:1.2em; }

@media (prefers-reduced-motion:reduce){ .card{ transition:none; } }
</style>
</head>

<script>
// Typographie française : espaces insécables avant ; : ! ? et autour des guillemets
function frTypo(s){
  return s
    .replace(/\s*:/g, '\u00A0:')                 // avant :
    .replace(/\s*([;!?])/g, '\u202F$1')          // avant ; ! ?
    .replace(/«\s*/g, '«\u00A0')                 // après «
    .replace(/\s*»/g, '\u00A0»')                 // avant »
    // mots de 1 à 2 lettres (à, de, le, la, un, et, tu...) collés au mot suivant
    .replace(/(?<=^|\s)([A-Za-zÀ-ÿ]{1,2}) (?=\S)/g, '$1\u00A0')
    // trait d'union insécable (Prépare-toi, toi-même, Colmate-les...)
    .replace(/([A-Za-zÀ-ÿ])-(toi|moi|le|la|les|lui|leur|nous|vous|y|en|même|mêmes|ci|là)(?![A-Za-zÀ-ÿ])/g, '$1\u2011$2');
}
// Un retour à la ligne après chaque phrase (. ! ? …)
function breakLines(s){
  return s.replace(/([.!?…])\s+(?=\S)/g, '$1\n');
}
// Expressions à ne jamais séparer (ajoute les tiennes ici)
const gluePhrases = [
  "quelque part",
  "à deux voix éclairera",
  "ce qu'une pensée seule n'a pas vu",
  "sans avoir toutes les réponses",
  "C'est déjà commencer",
  "sous la surface",
  "sans savoir pourquoi",
  "mérite d'être écouté",
  "quand même",
  "L'obstacle ne bouge pas",
  "par la force",
  "mais par la constance",
  "qu'une énergie neuve et pressée",
  "test simple",
  "pas d'un plan parfait"
];
function glue(s){
  gluePhrases.forEach(p => { s = s.split(p).join(p.replace(/ /g, '\u00A0')); });
  return s;
}
// Colle automatiquement articles, pronoms sujets, petits mots et verbes (règles générales)
const DET = new Set("le la les un une des du de au aux ce cet cette ces mon ton son ma ta sa mes tes ses notre votre leur leurs quelque quelques chaque tout toute tous toutes aucun aucune d'un d'une qu'un qu'une".split(" "));
const CLITIC = new Set("je tu il elle on nous vous ils elles ne se me te lui y en qui que si et ou mais ni à par sur sous dans avec sans pour vers chez".split(" "));
const GLUE_RIGHT = new Set(["pas","jamais","rien","point"]);
const MAXLEN = 34;   // longueur max d'un groupe « obligatoire » (article + nom, pronom + verbe...)
const SOFTMAX = 26;  // longueur max d'un groupe « souple » (sujet + verbe)
function smartGlue(s){
  const tokens = s.split(' ');
  const strip = t => t.toLowerCase().replace(/[.,;:!?…]+$/,'');
  const n = tokens.length;
  const link = new Array(n).fill(0);   // 2 = lien obligatoire, 1 = lien souple
  let pos = 0;
  for(let i=0;i<n;i++){
    const tk = tokens[i], w = strip(tk), next = tokens[i+1];
    if(next !== undefined && !/[.,;:!?…]$/.test(tk)){
      if(DET.has(w) || CLITIC.has(w) || GLUE_RIGHT.has(strip(next))) link[i] = 2;
      else if((pos === 1 && DET.has(strip(tokens[i-1]))) || (pos === 0 && /^(l|d)['’]/i.test(tk))) link[i] = 1;
    }
    pos = /[.!?…]$/.test(tk) ? 0 : pos + 1;
  }
  const out = []; let group = [tokens[0]]; let len = tokens[0].length;
  for(let i=0;i<n-1;i++){
    const next = tokens[i+1];
    const lim = link[i] === 2 ? MAXLEN : SOFTMAX;
    if(link[i] > 0 && len + 1 + next.length <= lim){ group.push(next); len += 1 + next.length; }
    else { out.push(group.join('\u00A0')); group = [next]; len = next.length; }
  }
  out.push(group.join('\u00A0'));
  return out.join(' ');
}
// Accord de genre : {masculin|féminin}
function applyGender(s, g){
  return s.replace(/\{([^{}|]+)\|([^{}|]+)\}/g, (_, m, f) => g === 'm' ? m : f);
}
function render(s, g){ return frTypo(smartGlue(glue(applyGender(s, g)))); }

const allDecks = [deck1, deck2, deck3, deck4, deck5, deck6, deck7];
let gender = 'f';   // 'm' ou 'f'
let deckIdx = 0;
let order = [];

function reshuffle(){
  order = names.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [order[i],order[j]] = [order[j],order[i]];
  }
}
reshuffle();

const stage = document.getElementById('stage');
const drawBtn = document.getElementById('drawBtn');
const guidance = document.getElementById('guidance');
const cardName = document.getElementById('cardName');
const cardKey = document.getElementById('cardKey');
const cardMsg = document.getElementById('cardMsg');
const subLine = document.getElementById('subLine');
const genderRow = document.getElementById('genderRow');
const deckRow = document.getElementById('deckRow');

function buildPills(row, labels, activeIdx, onClick){
  row.innerHTML = '';
  labels.forEach((lab, i)=>{
    const b = document.createElement('button');
    b.className = 'pill' + (i === activeIdx ? ' active' : '');
    b.textContent = lab;
    b.addEventListener('click', ()=> onClick(i));
    row.appendChild(b);
  });
}
function refreshPills(){
  buildPills(genderRow, ['Un homme','Une femme'], gender==='m'?0:1, (i)=>{ gender = i===0?'m':'f'; refreshPills(); });
  buildPills(deckRow, deckLabels, deckIdx, (i)=>{ deckIdx = i; reshuffle(); refreshPills(); });
  subLine.textContent = render(`Jeu\u00a0: ${deckLabels[deckIdx]}. Choisis un profil, puis touche la carte.`, gender).replace('\u00a0:','\u00A0:');
}
refreshPills();

let busy = false;
function reveal(idx){
  const [key, msg] = allDecks[deckIdx][idx];
  cardName.textContent = render(names[idx], gender);
  cardKey.textContent = render(key, gender);
  cardMsg.textContent = breakLines(render(msg, gender));
  stage.classList.add('flipped');
  guidance.textContent = "Respire un instant avant de relire le message.";
  busy = false;
}
function draw(){
  if(busy) return;
  busy = true;
  if(order.length === 0) reshuffle();
  const idx = order.pop();
  if(stage.classList.contains('flipped')){
    stage.classList.remove('flipped');
    setTimeout(()=>reveal(idx), 480);
  } else {
    reveal(idx);
  }
}

drawBtn.addEventListener('click', draw);
stage.addEventListener('click', draw);
stage.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); draw(); }
});
